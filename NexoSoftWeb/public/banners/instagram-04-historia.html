<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>SinGluten Life · IG historia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; }
      .board {
        display: block;
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        background:
          radial-gradient(900px 480px at 0% -8%, #b7e4fb 0%, transparent 58%),
          radial-gradient(760px 420px at 100% 0%, #ffd8cc 0%, transparent 52%),
          radial-gradient(820px 400px at 70% 100%, #c8f0dd 0%, transparent 55%),
          #e8f3f9;
      }
      .card {
        position: absolute;
        inset: 220px 72px 260px;
        border-radius: 48px;
        background: linear-gradient(155deg, #073a5c 0%, #0b6ea8 48%, #3cb4e4 100%);
        box-shadow: 0 24px 48px rgba(12, 43, 69, 0.18);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 88px 72px 80px;
        font-family: Outfit, system-ui, sans-serif;
      }
      .kicker { margin: 36px 0 18px; font-size: 22px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #ffd8cc; }
      .title { margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 700; letter-spacing: -0.03em; line-height: 0.98; font-size: 96px; }
      .lead { margin: 28px 0 0; max-width: 18ch; font-size: 36px; font-weight: 500; line-height: 1.25; color: #e8f6ff; }
      .points { margin: 0; padding: 0; list-style: none; display: grid; gap: 18px; font-size: 34px; font-weight: 600; color: #e8f6ff; }
      .mark { width: 110px; height: 110px; border-radius: 30px; display: grid; place-items: center; background: rgba(232, 246, 255, 0.16); }
      .chip { display: inline-flex; align-items: center; height: 56px; padding: 0 22px; border-radius: 999px; background: #fff; color: #0b6ea8; font-size: 22px; font-weight: 700; }
      .url { margin: 28px 0 0; font-size: 32px; font-weight: 700; color: #fff; }
    </style>
  </head>
  <body>
    <a class="board" href="https://singlutenlife.site/">
      <div class="card">
        <div>
          <div class="mark" aria-hidden="true">
            <svg width="58" height="58" viewBox="0 0 24 24" fill="none">
              <path d="M12 20.2V7.2" stroke="#e8f6ff" stroke-width="1.7" stroke-linecap="round" />
              <path d="M12 8.2c-1.7-.9-2.8-2.1-2.8-3.4M12 8.2c1.7-.9 2.8-2.1 2.8-3.4M12 11.2c-2-.7-3.3-1.8-3.3-3.1M12 11.2c2-.7 3.3-1.8 3.3-3.1M12 14.1c-2.1-.6-3.5-1.6-3.5-2.8M12 14.1c2.1-.6 3.5-1.6 3.5-2.8" stroke="#e8f6ff" stroke-width="1.55" stroke-linecap="round" />
              <path d="M6.2 17.6 17.8 6.4" stroke="#ffc4ae" stroke-width="2.3" stroke-linecap="round" />
            </svg>
          </div>
          <p class="kicker">SinGluten Life</p>
          <h1 class="title">Comé rico.<br />Comé seguro.</h1>
          <p class="lead">Gratis. Clara. Para abrirla todos los días.</p>
        </div>
        <ul class="points">
          <li>Lugares cerca</li>
          <li>Receta del día</li>
          <li>La mesa de todos</li>
        </ul>
        <div>
          <span class="chip">Entrá a la app</span>
          <p class="url">singlutenlife.site</p>
        </div>
      </div>
    </a>
  </body>
</html>
