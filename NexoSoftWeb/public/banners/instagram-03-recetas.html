<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>SinGluten Life · IG recetas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; }
      .board {
        display: block;
        width: 1080px;
        height: 1080px;
        position: relative;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        background:
          radial-gradient(900px 480px at 0% -8%, #b7e4fb 0%, transparent 58%),
          radial-gradient(760px 420px at 100% 0%, #ffd8cc 0%, transparent 52%),
          radial-gradient(820px 400px at 70% 100%, #c8f0dd 0%, transparent 55%),
          #e8f3f9;
      }
      .card {
        position: absolute;
        inset: 72px;
        border-radius: 48px;
        background: linear-gradient(155deg, #073a5c 0%, #0b6ea8 48%, #3cb4e4 100%);
        box-shadow: 0 24px 48px rgba(12, 43, 69, 0.18);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 68px 64px;
        font-family: Outfit, system-ui, sans-serif;
      }
      .kicker { margin: 0 0 18px; font-size: 22px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #ffd8cc; }
      .title { margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 700; letter-spacing: -0.03em; line-height: 0.98; font-size: 72px; }
      .lead { margin: 28px 0 0; max-width: 18ch; font-size: 32px; font-weight: 500; line-height: 1.25; color: #e8f6ff; }
      .points { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; font-size: 28px; font-weight: 600; color: #e8f6ff; }
      .points span { display: block; font-size: 18px; font-weight: 500; color: #ffd8cc; margin-top: 2px; }
      .foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
      .chip { display: inline-flex; align-items: center; height: 56px; padding: 0 22px; border-radius: 999px; background: #fff; color: #0b6ea8; font-size: 22px; font-weight: 700; }
      .url { margin: 0; font-size: 28px; font-weight: 700; color: #fff; }
    </style>
  </head>
  <body>
    <a class="board" href="https://singlutenlife.site/recetas">
      <div class="card">
        <div>
          <p class="kicker">En casa</p>
          <h1 class="title">Hoy la mesa está de tu lado.</h1>
          <p class="lead">Una receta distinta cada día, con dónde comprar lo que falta.</p>
        </div>
        <ul class="points">
          <li>Paso a paso<span>De varias fuentes y de la comunidad</span></li>
          <li>Logo sin TACC en el paquete<span>No es una certificación</span></li>
        </ul>
        <div class="foot">
          <span class="chip">Ver receta del día</span>
          <p class="url">singlutenlife.site</p>
        </div>
      </div>
    </a>
  </body>
</html>
