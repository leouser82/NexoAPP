<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>SinGluten Life · LinkedIn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #e8f3f9; }
      .banner {
        width: 1584px;
        height: 396px;
        position: relative;
        overflow: hidden;
        color: #0c2b45;
        font-family: Outfit, system-ui, sans-serif;
        background:
          radial-gradient(900px 280px at 0% -20%, #b7e4fb 0%, transparent 58%),
          radial-gradient(760px 260px at 100% 0%, #ffd8cc 0%, transparent 52%),
          radial-gradient(720px 240px at 70% 120%, #c8f0dd 0%, transparent 55%),
          #e8f3f9;
      }
      .panel {
        position: absolute;
        left: 280px;
        right: 72px;
        top: 56px;
        bottom: 56px;
        border-radius: 32px;
        background: linear-gradient(115deg, #0b6ea8 0%, #083554 78%);
        box-shadow: 0 18px 40px rgba(12, 43, 69, 0.16);
      }
      .content {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        align-items: center;
        padding: 0 96px 0 316px;
        gap: 22px;
      }
      .mark {
        width: 86px;
        height: 86px;
        flex: none;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: rgba(232, 246, 255, 0.14);
      }
      .word {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .name {
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #fff;
      }
      .tag {
        margin: 0;
        font-size: 22px;
        font-weight: 500;
        color: #ffd8cc;
      }
      .url {
        margin: 4px 0 0;
        font-size: 18px;
        font-weight: 700;
        color: #e8f6ff;
        letter-spacing: 0.02em;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="panel"></div>
      <div class="content">
        <div class="mark" aria-hidden="true">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
            <path d="M12 20.2V7.2" stroke="#e8f6ff" stroke-width="1.7" stroke-linecap="round" />
            <path d="M12 8.2c-1.7-.9-2.8-2.1-2.8-3.4M12 8.2c1.7-.9 2.8-2.1 2.8-3.4M12 11.2c-2-.7-3.3-1.8-3.3-3.1M12 11.2c2-.7 3.3-1.8 3.3-3.1M12 14.1c-2.1-.6-3.5-1.6-3.5-2.8M12 14.1c2.1-.6 3.5-1.6 3.5-2.8" stroke="#e8f6ff" stroke-width="1.55" stroke-linecap="round" />
            <path d="M6.2 17.6 17.8 6.4" stroke="#ffc4ae" stroke-width="2.3" stroke-linecap="round" />
          </svg>
        </div>
        <div class="word">
          <h1 class="name">SinGluten Life</h1>
          <p class="tag">Comé rico. Comé seguro.</p>
          <a class="url" href="https://singlutenlife.site/">singlutenlife.site</a>
        </div>
      </div>
    </div>
  </body>
</html>
